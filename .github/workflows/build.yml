name: KiCad Project Build and Validation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-24.04
    name: KiCad Project Build and Validation
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6
      with:
        submodules: recursive
        fetch-depth: 0
    - name: Add KiCad Repository
      run: |
        sudo add-apt-repository --yes ppa:kicad/kicad-10.0-releases
        sudo apt-get update
    - name: Cache Required Packages
      uses: awalsh128/cache-apt-pkgs-action@latest
      with:
        packages: cmake ninja-build kicad kicad-libraries
        version: 1.0
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - run: pip install frugy
    - name: Determine changed project directories
      id: changes
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
        else
          BASE_SHA="${{ github.event.before }}"
        fi

        ALL_DIRS=$(ls -d */ 2>/dev/null | sed 's:/*$::')

        # Initial push or unknown base: build everything.
        if [ -z "$BASE_SHA" ] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
          echo "No base SHA available; building all project directories."
          CHANGED="$ALL_DIRS"
        else
          # If this build workflow or any submodule reference changed, rebuild everything.
          if git diff --name-only "$BASE_SHA" HEAD | grep -qE '^(\.github/workflows/build\.yml$|\.gitmodules$)'; then
            echo "build.yml or submodules changed; building all project directories."
            CHANGED="$ALL_DIRS"
          else
            CHANGED=$(git diff --name-only "$BASE_SHA" HEAD | awk -F/ 'NF>1 {print $1}' | sort -u)
          fi
        fi

        SELECTED=""
        for DIR in $CHANGED; do
          if [ -f "$DIR/CMakeLists.txt" ]; then
            SELECTED="$SELECTED $DIR"
          fi
        done
        SELECTED=$(echo "$SELECTED" | xargs)

        if [ -z "$SELECTED" ]; then
          echo "No KiCad project directories touched by this change."
        else
          echo "Will build: $SELECTED"
        fi
        echo "dirs=$SELECTED" >> "$GITHUB_OUTPUT"
    - name: Build and Validate KiCad Project
      if: steps.changes.outputs.dirs != ''
      run: |
        for DIR in ${{ steps.changes.outputs.dirs }}; do
          echo "Processing directory: $DIR"
          pushd ${{github.workspace}}/$DIR
          cmake -B ./build -G Ninja
          cmake --build ./build --target erc
          cmake --build ./build --target drc
          cmake --build ./build --target production
          cmake --build ./build --target pdf
          popd
        done
